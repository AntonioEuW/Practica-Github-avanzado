name: Comprobar token de desarrollo

on:
  push:

jobs:
  comprobar-token:
    runs-on: self-hosted

    steps:
      - name: Comparar token de GitHub con token local
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden correctamente."
          } else {
            Write-Host "ERROR: Los tokens no coinciden."
            exit 1
          }
